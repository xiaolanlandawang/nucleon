<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{$site_info.site_name|default=''}</title>
    <meta name="keywords" content="{$site_info.site_name|default=''}">
    <meta name="description" content="{$site_info.site_name|default=''}">
    <include file="public@head"/>
    <link href="__TMPL__/public/assets/css/about.css" rel="stylesheet" type="text/css">
    <script type="text/javascript" src="__TMPL__/public/assets/js/about.js"></script>
</head>
<body>

<include file="public@nav"/>

<include file="public@banner"/>


<!-- CERTIFICATE START -->
<div class="certificate">
    <div class="title">CERTIFICATE</div>
    <notempty name="about_site.cert_description">
        <div class="certificate-main-desc" style="text-align: center; margin-top: 30px; font-size: 16px; color: #666666; max-width: 1000px; margin-left: auto; margin-right: auto; line-height: 1.6;">{$about_site.cert_description}</div>
    </notempty>
    <ul class="certificate-list" style="margin-top: 30px;">
        <foreach name="about_site.cert" item="vo">
            <li class="certificate-item">
                <div class="certificate-img-wrap">
                    <img src="{:cmf_get_image_url($vo.url)}" alt="{$vo.name}">
                </div>
                <notempty name="vo.desc">
                    <div class="certificate-desc" style="text-align: center; margin-top: 10px; font-size: 20px; color: #1A1A1A; font-weight: bold;">{$vo.desc}</div>
                </notempty>
            </li>
        </foreach>
    </ul>
</div>
<div class="certificate-preview" aria-hidden="true">
    <button class="certificate-preview-close" type="button" aria-label="Close"></button>
    <button class="certificate-preview-arrow certificate-preview-prev" type="button" aria-label="Previous"></button>
    <div class="certificate-preview-content">
        <img src="" alt="">
    </div>
    <button class="certificate-preview-arrow certificate-preview-next" type="button" aria-label="Next"></button>
</div>
<!-- CERTIFICATE END -->

<div class="gallery">
    <div class="title">WEIHUA GALLERY</div>
    <div class="gallery-list">
        <foreach name="about_site.corporate_images" item="vo">
            <div class="gallery-item">
                <div class="gallery-item-img">
                    <img src="{:cmf_get_image_url($vo.url)}" alt="gallery">
                </div>
                <div class="gallery-item-title">{$vo.name}</div>
            </div>
        </foreach>
    </div>
</div>


<include file="public@foot"/>

</body>
</html>
