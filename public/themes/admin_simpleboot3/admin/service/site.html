<script type="text/html" id="company-item-tpl">
    <li id="saved-company{id}">
        <input id="company-{id}" type="hidden" name="company_urls[]" value="{filepath}">
        <input class="form-control" id="company-{id}-name" type="text" name="company_names[]" value="{name}"
               style="width: 400px;" title="图片名称">
        <img id="company-{id}-preview" src="{url}" style="height:34px;width: 44px;"
             onclick="imagePreviewDialog(this.src);">
        <a class="btn btn-default" href="javascript:uploadOneImage('图片上传','#company-{id}');"><i class="fa fa-upload fa-fw"></i></a>
        <a class="btn btn-danger" href="javascript:(function(){$('#saved-company{id}').remove();})();"><i class="fa fa-trash fa-fw"></i></a>
        <a class="btn btn-success" href="javascript:(function(){$('#saved-company{id}').before($('#saved-company{id}').next());})();"><i class="fa fa-arrow-down fa-fw"></i></a>
    </li>
</script>

<script type="text/html" id="packaging-item-tpl">
    <li id="saved-packaging{id}" style="border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; display: inline-block; width: 23%; margin-right: 1%; vertical-align: top;">
        <div style="margin-bottom: 10px;">
            <input id="packaging-img-{id}" type="hidden" name="service[packaging_items][{id}][img]" value="">
            <img id="packaging-img-{id}-preview" src="__TMPL__/public/assets/images/default-thumbnail.png" style="height:100px;width: 100%; object-fit: cover; cursor: pointer;" onclick="parent.imagePreviewDialog(this.src);">
            <div style="margin-top: 5px;">
                <a class="btn btn-default btn-sm" href="javascript:uploadOneImage('图片上传','#packaging-img-{id}');">上传图片</a>
            </div>
        </div>
        <div style="margin-bottom: 10px;">
            名称：<input class="form-control" type="text" name="service[packaging_items][{id}][name]" value="" style="width: 100%;">
        </div>
        <a class="btn btn-danger btn-sm" href="javascript:(function(){$('#saved-packaging{id}').remove();})();"><i class="fa fa-trash fa-fw"></i>删除</a>
    </li>
</script>
<script type="text/html" id="cooperation-item-tpl">

            <div style="margin-top: 5px;">

        <div style="margin-bottom: 10px;">
            名称：<input class="form-control" type="text" name="service[cooperation_items][{id}][name]" value="" style="width: 100%;">
        </div>
        <a class="btn btn-danger btn-sm" href="javascript:(function(){$('#saved-cooperation{id}').remove();})();"><i class="fa fa-trash fa-fw"></i>删除</a>

<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="javascript:;">服务设置</a></li>

    <form class="form-horizontal js-ajax-form margin-top-20" role="form" action="{:url('Service/sitePost')}"
          method="post">
        <div class="tabbable">
            <div class="tab-content">

                <div class="form-group">
                    <label class="col-sm-2 control-label">
                        合作公司

                    <div class="col-md-6 col-sm-10">
                        <ul id="company" class="pic-list list-unstyled form-inline">
                            <notempty name="site_info.companies">

                                    <li id="saved-company{$key}">

                                             style="height:34px;width: 44px;"

                                        <a class="btn btn-success"  href="javascript:(function(){$('#saved-company{$key}').before($('#saved-company{$key}').next());})();"><i class="fa fa-arrow-down fa-fw"></i></a>

                </div>

                            <notempty name="site_info.packaging_items">
                                <foreach name="site_info.packaging_items" item="vo">

                                        <div style="margin-bottom: 10px;">
                                            <input id="packaging-img-{$key}" type="hidden" name="service[packaging_items][{$key}][img]" value="{$vo.img|default=''}">
                                            <if condition="empty($vo['img'])">
                                                <img id="packaging-img-{$key}-preview" src="__TMPL__/public/assets/images/default-thumbnail.png" style="height:100px;width: 100%; object-fit: cover; cursor: pointer;" onclick="parent.imagePreviewDialog(this.src);">
                                            <else/>
                                                <img id="packaging-img-{$key}-preview" src="{:cmf_get_image_preview_url($vo['img'])}" style="height:100px;width: 100%; object-fit: cover; cursor: pointer;" onclick="parent.imagePreviewDialog(this.src);">

                                            </div>
                                        </div>
                                        <div style="margin-bottom: 10px;">
                                            名称：<input class="form-control" type="text" name="service[packaging_items][{$key}][name]" value="{$vo.name|default=''}" style="width: 100%;">
                                        </div>
                                        <a class="btn btn-danger btn-sm" href="javascript:(function(){$('#saved-packaging{$key}').remove();})();"><i class="fa fa-trash fa-fw"></i>删除</a>
                                    </li>
                                </foreach>
                            </notempty>
                        </ul>
                        <a href="javascript:packagings_add();" class="btn btn-default">添加项</a>
                    </div>
                </div>
                </div>

                <!-- Cooperation Process -->

                    <label class="col-sm-2 control-label">合作流程模块标题</label>
                    <div class="col-md-6 col-sm-10">
                        <input class="form-control" type="text" name="service[cooperation_title]" value="{$site_info.cooperation_title|default='Cooperation Process'}">
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">合作流程列表</label>
                    <div class="col-md-8 col-sm-10">
                        <ul id="cooperations" class="list-unstyled">
                            <notempty name="site_info.cooperation_items">

                <!-- Technical Support -->
                <div class="form-group">
                    <label class="col-sm-2 control-label">技术支持模块标题</label>

                </div>

                <div class="form-group">

                                    <li id="saved-support{$key}" style="border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; display: inline-block; width: 23%; margin-right: 1%; vertical-align: top;">

                                        </div>
                                        <a class="btn btn-danger btn-sm" href="javascript:(function(){$('#saved-support{$key}').remove();})();"><i class="fa fa-trash fa-fw"></i>删除</a>
                                    </li>

                        <a href="javascript:supports_add();" class="btn btn-default">添加项</a>
                    </div>
                    </div>

                    <label class="col-sm-2 control-label">售后服务模块标题</label>
                    <div class="col-md-6 col-sm-10">

                    </div>
                </div>

                <div class="form-group">

                    <div class="col-md-8 col-sm-10">
                        <div style="border: 1px solid #ddd; padding: 20px; background: #f9f9f9;">
                            <!-- 左侧大图 -->
                            <div class="form-group" style="margin-bottom: 20px;">
                                <label class="col-sm-2 control-label">左侧客服大图</label>
                                <div class="col-md-10">
                                    <input id="aftersales-img-left" type="hidden" name="service[aftersales_img_left]" value="{$site_info.aftersales_img_left|default=''}">
                                    <if condition="empty($site_info['aftersales_img_left'])">

                                    <else/>
                                        <img id="aftersales-img-left-preview" src="{:cmf_get_image_preview_url($site_info['aftersales_img_left'])}" style="height:100px;width: auto; cursor: pointer;" onclick="parent.imagePreviewDialog(this.src);">

                                    <div style="margin-top: 5px;">
                                        <a class="btn btn-default btn-sm" href="javascript:uploadOneImage('图片上传','#aftersales-img-left');">上传图片</a>

                                        <a class="btn btn-sm" href="javascript:;" onclick="$('#aftersales-img-mt-preview').attr('src','__TMPL__/public/assets/images/default-thumbnail.png');$('#aftersales-img-mt').val('');">取消</a>

                                </div>
                            </div>

                            <!-- 中间底部 -->
                            <div class="form-group" style="margin-bottom: 20px; border-top: 1px solid #eee; padding-top: 20px;">
                                <label class="col-sm-2 control-label">中间下图</label>
                                <div class="col-md-10">
                                    <input id="aftersales-img-mb" type="hidden" name="service[aftersales_img_mb]" value="{$site_info.aftersales_img_mb|default=''}">
                                    <if condition="empty($site_info['aftersales_img_mb'])">

                                <label class="col-sm-2 control-label">右侧证书图片</label>
                                <div class="col-md-10">
                                    <input id="aftersales-img-right" type="hidden" name="service[aftersales_img_right]" value="{$site_info.aftersales_img_right|default=''}">
                                    <if condition="empty($site_info['aftersales_img_right'])">

                                    <else/>
                                        <img id="aftersales-img-right-preview" src="{:cmf_get_image_preview_url($site_info['aftersales_img_right'])}" style="height:100px;width: auto; cursor: pointer;" onclick="parent.imagePreviewDialog(this.src);">

                                    <div style="margin-top: 5px;">

</div>
<script type="text/javascript" src="__STATIC__/js/admin.js?v={$_static_version}"></script>
<script type="text/javascript">
    function packagings_add() {
        var timestamp = new Date().getTime();
        var randomNum = Math.random();
        var scaledRandomNum = Math.floor(randomNum * 1000);
        var id = timestamp.toString() + scaledRandomNum.toString();
        var tpl = $('#packaging-item-tpl').html().replace(/\{id\}/g, id);
        $('#packagings').append(tpl);
    }
    function cooperations_add() {
        var timestamp = new Date().getTime();
        var randomNum = Math.random();
        var scaledRandomNum = Math.floor(randomNum * 1000);
        var id = timestamp.toString() + scaledRandomNum.toString();
        var tpl = $('#cooperation-item-tpl').html().replace(/\{id\}/g, id);
        $('#cooperations').append(tpl);
    }
    function supports_add() {
        var timestamp = new Date().getTime();
        var randomNum = Math.random();
        var scaledRandomNum = Math.floor(randomNum * 1000);
        var id = timestamp.toString() + scaledRandomNum.toString();
        var tpl = $('#support-item-tpl').html().replace(/\{id\}/g, id);
        $('#supports').append(tpl);
    }
</script>
